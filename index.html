<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Prince Quiz</title>
    <style>
        :root {
            --bg-color: #07070a;
            --card-bg: rgba(18, 14, 26, 0.94);
            --accent-gold: #ffd700;
            --accent-gold-glow: #ffaa00;
            --accent-crimson: #e62143;
            --accent-cyan: #00f2fe;
            --text-color: #ffffff;
            --success-green: #2ecc71;
            --danger-red: #e74c3c;
            --glass-border: rgba(255, 215, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            user-select: none;
        }

        /* Canvas Elements */
        #bg-canvas, #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        #bg-canvas { z-index: 0; }
        #confetti-canvas { z-index: 20; }

        /* Game Header Bar */
        #top-bar {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 11, 22, 0.88);
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 10px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-item { font-weight: bold; color: var(--accent-gold); font-size: 1em; }
        
        .badge-box {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .high-score-badge {
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95em;
            font-weight: bold;
        }

        .streak-badge {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            display: none;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 5px #ff416c; }
            100% { transform: scale(1.08); box-shadow: 0 0 18px #ff4b2b; }
        }

        /* Title Logo */
        .game-title {
            color: var(--accent-gold);
            font-size: 2.2em;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5), 0 0 30px rgba(230, 33, 67, 0.4);
            font-weight: 800;
        }

        /* Main Game Box */
        #game-container {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            margin: 15px 0 30px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 25px rgba(255, 215, 0, 0.1);
            text-align: center;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            animation: zoomIn 0.5s ease;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #d4af37);
            color: #0d0a14;
            border: none;
            padding: 12px 24px;
            margin: 6px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5); 
            background: linear-gradient(135deg, #ffe033, #f1c40f);
        }
        .btn:disabled { background: #333; color: #777; cursor: not-allowed; opacity: 0.5; transform: none; box-shadow: none; }

        .cat-btn {
            width: 100%;
            max-width: 420px;
            padding: 16px;
            margin: 12px auto;
            display: block;
            font-size: 1.1em;
            text-align: left;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            color: #fff;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .cat-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Timer System */
        #timer-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-gold-glow));
            transition: width 1s linear, background 0.3s ease;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: rgba(255,255,255,0.04);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 14px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) { 
            background: rgba(255, 215, 0, 0.15); 
            border-color: var(--accent-gold); 
            transform: translateX(6px);
        }

        .option-btn.correct { 
            background: linear-gradient(135deg, #27ae60, #2ecc71) !important; 
            border-color: #2ecc71 !important; 
            color: #fff;
            animation: bounce 0.5s ease;
        }

        .option-btn.wrong { 
            background: linear-gradient(135deg, #c0392b, #e74c3c) !important; 
            border-color: #e74c3c !important; 
            color: #fff;
            animation: shake 0.4s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Lifelines */
        #lifelines-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .lifeline-btn {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            font-size: 0.9em;
        }

        .lifeline-btn:hover:not(:disabled) { 
            background: var(--accent-gold); 
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .lifeline-btn:disabled { 
            background: rgba(255,255,255,0.03); 
            border-color: rgba(255,255,255,0.1); 
            color: #555;
            cursor: not-allowed; 
            opacity: 0.4; 
            transform: none; 
        }

        #timer-box { font-size: 1.2em; font-weight: bold; color: var(--accent-gold); margin-bottom: 10px; }
        .hidden { display: none !important; }

        .game-over-box {
            padding: 25px;
            border-radius: 16px;
            background: rgba(0,0,0,0.3);
            margin-top: 15px;
        }

        /* Modal Screens */
        .modal {
            position: fixed;
            z-index: 100;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-gold);
            padding: 30px;
            border-radius: 20px;
            width: 88%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.3);
        }

        .poll-bar-container { margin: 14px 0; text-align: left; }
        .poll-bar-label { font-size: 0.95em; margin-bottom: 6px; }
        .poll-bar-bg { background: rgba(255,255,255,0.1); height: 20px; border-radius: 10px; overflow: hidden; }
        .poll-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-gold), #f1c40f); width: 0%; transition: width 1s ease-out; }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
            text-align: left;
            background: rgba(255,255,255,0.03);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        #explanation-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 15px;
            margin-top: 18px;
            font-size: 0.98em;
            color: #fff8dc;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        select.btn {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 30px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d0a14'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }

        .royale-stage-banner {
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-crimson), var(--accent-gold));
            background-size: 200% auto;
            color: #000;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <div id="top-bar">
        <div class="stats-item badge-box">
            👑 <span id="txt-bag">Golden Crowns</span>: <span id="crown-count">0</span>
        </div>
        <div class="high-score-badge">🏆 Best: <span id="high-score">0</span></div>
        <div id="streak-badge" class="streak-badge">🔥 <span id="streak-count">0</span>x Streak</div>
        <div class="stats-item"><span id="txt-stage">اسٹیج</span>: <span id="current-stage">1</span>/<span id="total-stages-count">15</span></div>
        <div>
            <select id="lang-select" class="btn" onchange="changeLanguage()">
                <option value="ur">اردو (Urdu)</option>
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="ar">العربية (Arabic)</option>
            </select>
            <button class="btn" onclick="toggleSound()">🔊 <span id="sound-status">ON</span></button>
        </div>
    </div>

    <h1 class="game-title">👑 Golden Prince Quiz</h1>

    <div id="game-container">
        
        <div id="category-screen">
            <h2 id="cat-title" style="color: var(--accent-gold); margin-bottom: 25px;">کیٹیگری منتخب کریں (Select Category)</h2>
            <button class="btn cat-btn" onclick="selectCategory('islamic')">🕌 Islamic Knowledge (15 Stages)</button>
            <button class="btn cat-btn" onclick="selectCategory('gk')">🌍 World & General Knowledge (15 Stages)</button>
            <button class="btn cat-btn" onclick="selectCategory('science')">🔬 Science & Technology (15 Stages)</button>
            <button class="btn cat-btn" onclick="selectCategory('history')">📜 History & Civilizations (15 Stages)</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div id="royale-banner" class="royale-stage-banner hidden">👑 GOLDEN PRINCE ROYALE FINAL STAGE 👑</div>

            <div id="lifelines-container">
                <button class="lifeline-btn" id="life-5050" onclick="use5050()">✂️ 50:50</button>
                <button class="lifeline-btn" id="life-poll" onclick="useAudiencePoll()">📊 Audience Poll</button>
                <button class="lifeline-btn" id="life-skip" onclick="useSkip()">⏭️ Skip</button>
                <button class="lifeline-btn" id="life-time" onclick="useTimeFreeze()">⌛ Freeze Time</button>
                <button class="lifeline-btn" id="life-double" onclick="useDoubleCrowns()">👑 2x Crowns</button>
            </div>

            <div id="timer-box">⏱️ <span id="timer-count">30</span>s</div>
            <div id="timer-container"><div id="timer-bar"></div></div>
            <h3 id="question-text" style="font-size: 1.3em; margin: 20px 0; line-height: 1.5;">Sawal...</h3>
            <div id="options-container"></div>
            <div id="explanation-box" class="hidden">💡 <span id="explanation-text"></span></div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="game-over-box">
                <h2 id="result-title" style="font-size: 2em; color: var(--accent-gold);">Game Over!</h2>
                <p id="result-desc" style="font-size: 1.2em; line-height: 1.6;"></p>
                <div class="stat-grid">
                    <div>🔥 Max Streak: <b id="stat-max-streak">0</b></div>
                    <div>🎯 Accuracy: <b id="stat-accuracy">0%</b></div>
                </div>
                <button class="btn" onclick="restartGame()" id="btn-restart">دوبارہ کھیلیں (Play Again)</button>
            </div>
        </div>

    </div>

    <!-- Audience Poll Modal -->
    <div id="poll-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="poll-modal-title" style="color: var(--accent-gold);">📊 Audience Poll</h3>
            <div id="poll-results-body"></div>
            <button class="btn" onclick="closePollModal()" style="margin-top: 20px;">OK</button>
        </div>
    </div>

    <script>
        let crowns = 0;
        let currentStage = 1;
        let soundEnabled = true;
        let selectedCategory = 'islamic';
        let currentLang = 'ur';
        let activeQuestions = [];
        let currentQIndex = 0;
        let timerInterval;
        let maxTimeForStage = 30;
        let timeLeft = 30;
        let isTimeFrozen = false;
        let isDoubleCrownsActive = false;
        let currentQuestionObj = null;

        // Stats & Highscores
        let currentStreak = 0;
        let maxStreak = 0;
        let correctAnswersCount = 0;
        let totalQuestionsAnswered = 0;
        let highScore = parseInt(localStorage.getItem('gp_v1_high_score') || '0');

        let usedLifelines = { '5050': false, 'poll': false, 'skip': false, 'time': false, 'double': false };

        const uiTranslations = {
            ur: {
                moneyBag: "گولڈن کراؤنز", stage: "اسٹیج", catTitle: "کیٹیگری منتخب کریں",

            },

            },
            hi: {

                restartBtn: "फिर से खेलें", timeUp: "समय समाप्त हो गया!", wrongAns: "गलत उत्तर!",
                stageCleared: "बधाई हो! आपने गोल्डन प्रिंस के सभी चरणों को जीत लिया है!", soundOn: "चालू", soundOff: "बंद", pollTitle: "दर्शकों की राय"
            },
            ar: {
                moneyBag: "التيجان الذهبية", stage: "المرحلة", catTitle: "اختر الفئة",
                restartBtn: "إعادة اللعب", timeUp: "انتهى الوقت!", wrongAns: "إجابة خاطئة!",
                stageCleared: "تهانينا! لقد حققت اللقب وشعرت كمجد الأمير الذهبي!", soundOn: "مفعل", soundOff: "معطل", pollTitle: "نتيجة تصويت الجمهور"
            }
        };

        const quizDatabase = {
            islamic: {

                    { q: "اسلام کا پہلا رکن کون سا ہے؟", options: ["نماز", "توحید و رسالت", "روزه", "زکوٰۃ"], correct: 1, info: "توحید و رسالت (کلمہ شہادت) اسلام کا بنیادی اور پہلا رکن ہے۔" },
                    { q: "قرآن مجید میں کل کتنے پارے ہیں؟", options: ["20", "25", "30", "40"], correct: 2, info: "قرآن پاک میں کل 30 پارے اور 114 سورتیں ہیں۔" },
                    { q: "قرآن کی سب سے بڑی سورت کون سی ہے؟", options: ["سورۃ البقرہ", "سورۃ یاسین", "سورۃ الرحمن", "سورۃ الفاتحہ"], correct: 0, info: "سورۃ البقرہ قرآن پاک کی طویل ترین سورت ہے جس میں 286 آیات ہیں۔" },
                    { q: "مسجد اقصی کس شہر میں واقع ہے؟", options: ["مکہ", "مدینہ", "القدس (یروشلم)", "قاہرہ"], correct: 2, info: "مسجد اقصی القدس میں واقع ہے اور یہ مسلمانوں کا پہلا قبلہ ہے۔" },
                    { q: "خاتم النبیین کے معنی کیا ہیں؟", options: ["آخری نبی", "پہلے نبی", "نبیوں کے سردار", "نبیوں کے بھائی"], correct: 0, info: "خاتم النبیین سے مراد آخری نبی حضرت محمد ﷺ ہیں، جن کے بعد کوئی نبی نہیں آئے گا۔" },
                    { q: "حج کس مہینے میں ادا کیا جاتا ہے؟", options: ["رمضان", "شوال", "ذوالالحجہ", "محرّم"], correct: 2, info: "حج اسلامی سال کے آخری مہینے ذوالالحجہ کی 8 سے 12 تاریخ تک ادا کیا جاتا ہے۔" },

                    { q: "في أي عام اندلعت الثورة الفرنسية؟", options: ["1789", "1805", "1750", "1812"], correct: 0, info: "اندلعت الثورة الفرنسية عام 1789." },
                    { q: "بعد أي معركة حرر صلاح الدين القدس؟", options: ["معركة حطين", "معركة اليرموك", "معركة القادسية", "معركة عين جالوت"], correct: 0, info: "حرر القدس بعد معركة حطين عام 1187 م." },
                    { q: "متى بدأت الحرب العالمية الأولى؟", options: ["1912", "1914", "1918", "1939"], correct: 1, info: "بدأت الحرب العالمية الأولى عام 1914." },
                    { q: "في أي سنة تم هدم جدار برلين؟", options: ["1989", "1991", "1975", "1980"], correct: 0, info: "سقط جدار برلين في نوفمبر 1989." },
                    { q: "👑 نهائي الأمير الذهبي: كم سنة استمر الحكم الإسلامي في الأندلس؟", options: ["500 سنة", "أكثر من 700 سنة", "300 سنة", "1000 سنة"], correct: 1, info: "استمر الحكم الإسلامي زهاء 800 عام (من 711 إلى 1492 م)." }
                ]
            }
        };

        // Initialize Highscore display
        document.getElementById('high-score').innerText = highScore;

        // Background Particles Canvas
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i = 0; i < 65; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 1,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0) p.x = canvas.width;
                if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height;
                if(p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Confetti Canvas Engine
        const cCanvas = document.getElementById('confetti-canvas');
        const cCtx = cCanvas.getContext('2d');
        let confettiPieces = [];

        function resizeConfetti() {
            cCanvas.width = window.innerWidth;
            cCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function triggerConfetti() {
            confettiPieces = [];
            const colors = ['#ffd700', '#e62143', '#2ecc71', '#00f2fe', '#ffffff', '#f39c12'];
            for(let i = 0; i < 180; i++) {
                confettiPieces.push({
                    x: cCanvas.width / 2,
                    y: cCanvas.height / 2,
                    w: Math.random() * 10 + 6,
                    h: Math.random() * 10 + 6,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16 - 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 14,
                    gravity: 0.18
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if(confettiPieces.length === 0) return;
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            confettiPieces.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rot += p.vRot;

                cCtx.save();
                cCtx.translate(p.x, p.y);
                cCtx.rotate((p.rot * Math.PI) / 180);
                cCtx.fillStyle = p.color;
                cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                cCtx.restore();

                if(p.y > cCanvas.height) confettiPieces.splice(idx, 1);
            });
            if(confettiPieces.length > 0) requestAnimationFrame(animateConfetti);
        }

        // Audio Effects Synthesizer
        let audioCtx = null;
        function playSound(type) {
            if (!soundEnabled) return;
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.03);
            } else if (type === 'cheer') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.7);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-status').innerText = soundEnabled ? uiTranslations[currentLang].soundOn : uiTranslations[currentLang].soundOff;
        }

        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            document.getElementById('txt-bag').innerText = uiTranslations[currentLang].moneyBag;
            document.getElementById('txt-stage').innerText = uiTranslations[currentLang].stage;
            document.getElementById('cat-title').innerText = uiTranslations[currentLang].catTitle;
            document.getElementById('btn-restart').innerText = uiTranslations[currentLang].restartBtn;

            document.documentElement.lang = currentLang;
            document.body.style.direction = (currentLang === 'ur' || currentLang === 'ar') ? 'rtl' : 'ltr';

            if (!document.getElementById('quiz-screen').classList.contains('hidden') && activeQuestions.length > 0) {
                activeQuestions = quizDatabase[selectedCategory][currentLang].map(q => {
                    const shuffledOpts = shuffleArray(q.options);
                    const correctText = q.options[q.correct];
                    const newCorrectIdx = shuffledOpts.indexOf(correctText);
                    return { q: q.q, options: shuffledOpts, correct: newCorrectIdx, info: q.info };
                });
                loadStage();
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectCategory(cat) {
            playSound('click');
            selectedCategory = cat;
            currentStage = 1;
            crowns = 0;
            currentStreak = 0;
            maxStreak = 0;
            correctAnswersCount = 0;
            totalQuestionsAnswered = 0;

            resetLifelines();
            
            activeQuestions = quizDatabase[selectedCategory][currentLang].map(q => {
                const shuffledOpts = shuffleArray(q.options);
                const correctText = q.options[q.correct];
                const newCorrectIdx = shuffledOpts.indexOf(correctText);
                return { q: q.q, options: shuffledOpts, correct: newCorrectIdx, info: q.info };
            });
            
            document.getElementById('total-stages-count').innerText = activeQuestions.length;
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            updateStats();
            loadStage();
        }

        function resetLifelines() {
            usedLifelines = { '5050': false, 'poll': false, 'skip': false, 'time': false, 'double': false };
            document.getElementById('life-5050').disabled = false;
            document.getElementById('life-poll').disabled = false;
            document.getElementById('life-skip').disabled = false;
            document.getElementById('life-time').disabled = false;
            document.getElementById('life-double').disabled = false;
        }

        function updateStats() {
            document.getElementById('crown-count').innerText = crowns;
            document.getElementById('current-stage').innerText = currentStage;
            
            if (crowns > highScore) {
                highScore = crowns;
                localStorage.setItem('gp_v1_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
            }

            const streakBadge = document.getElementById('streak-badge');
            if(currentStreak > 1) {
                streakBadge.style.display = 'inline-block';
                document.getElementById('streak-count').innerText = currentStreak;
            } else {
                streakBadge.style.display = 'none';
            }
        }

        function loadStage() {
            currentQIndex = currentStage - 1;
            currentQuestionObj = activeQuestions[currentQIndex];
            isDoubleCrownsActive = false;

            document.getElementById('explanation-box').classList.add('hidden');

            const royaleBanner = document.getElementById('royale-banner');
            if (currentStage === 15) {
                royaleBanner.classList.remove('hidden');
            } else {
                royaleBanner.classList.add('hidden');
            }

            document.getElementById('question-text').innerText = `[Stage ${currentStage}] ${currentQuestionObj.q}`;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentQuestionObj.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            // Dynamic Time Scaling
            if (currentStage <= 4) maxTimeForStage = 30;
            else if (currentStage <= 8) maxTimeForStage = 25;
            else if (currentStage <= 12) maxTimeForStage = 20;
            else maxTimeForStage = 15;

            // Extra time given for Royale stage
            if (currentStage === 15) maxTimeForStage = 25;

            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = maxTimeForStage;
            isTimeFrozen = false;
            document.getElementById('timer-count').innerText = timeLeft;
            
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';
            timerBar.style.background = 'linear-gradient(90deg, var(--accent-gold), var(--accent-gold-glow))';

            timerInterval = setInterval(() => {
                if (!isTimeFrozen) {
                    timeLeft--;
                    document.getElementById('timer-count').innerText = timeLeft;
                    
                    const pct = (timeLeft / maxTimeForStage) * 100;
                    timerBar.style.width = `${pct}%`;

                    if (timeLeft <= 5) {
                        timerBar.style.background = 'var(--danger-red)';
                        playSound('tick');
                    }

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        gameOver(uiTranslations[currentLang].timeUp);
                    }
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            totalQuestionsAnswered++;
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => btn.disabled = true);

            if (currentQuestionObj.info) {
                document.getElementById('explanation-text').innerText = currentQuestionObj.info;
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            if (selectedIndex === currentQuestionObj.correct) {
                playSound('correct');
                optionBtns[selectedIndex].classList.add('correct');
                
                correctAnswersCount++;
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;

                const multiplier = currentStreak > 1 ? currentStreak : 1;
                let earnedCrowns = (100 * currentStage) * multiplier;

                if (isDoubleCrownsActive) {
                    earnedCrowns *= 2;
                }

                crowns += earnedCrowns;
                updateStats();

                setTimeout(() => {
                    if (currentStage < activeQuestions.length) {
                        currentStage++;
                        updateStats();
                        loadStage();
                    } else {
                        gameWin();
                    }
                }, 2200);
            } else {
                playSound('wrong');
                currentStreak = 0;
                updateStats();

                optionBtns[selectedIndex].classList.add('wrong');
                optionBtns[currentQuestionObj.correct].classList.add('correct');

                setTimeout(() => {
                    gameOver(uiTranslations[currentLang].wrongAns);
                }, 2500);
            }
        }

        // Lifeline Actions
        function use5050() {
            if (usedLifelines['5050']) return;
            playSound('click');
            usedLifelines['5050'] = true;
            document.getElementById('life-5050').disabled = true;

            const optionBtns = document.querySelectorAll('.option-btn');
            let removedCount = 0;
            
            for (let i = 0; i < optionBtns.length; i++) {
                if (i !== currentQuestionObj.correct && removedCount < 2) {
                    optionBtns[i].style.visibility = 'hidden';
                    removedCount++;
                }
            }
        }

        function useAudiencePoll() {
            if (usedLifelines['poll']) return;
            playSound('click');
            usedLifelines['poll'] = true;
            document.getElementById('life-poll').disabled = true;

            const pollModal = document.getElementById('poll-modal');
            const pollBody = document.getElementById('poll-results-body');
            document.getElementById('poll-modal-title').innerText = `📊 ${uiTranslations[currentLang].pollTitle}`;
            pollBody.innerHTML = '';

            let correctPct = Math.floor(Math.random() * 20) + 60; 
            let remainingPct = 100 - correctPct;
            
            let p1 = Math.floor(Math.random() * remainingPct);
            let p2 = Math.floor(Math.random() * (remainingPct - p1));
            let p3 = remainingPct - p1 - p2;
            let otherPct = [p1, p2, p3];

            let percentages = [];
            let otherIdx = 0;

            for (let i = 0; i < 4; i++) {
                if (i === currentQuestionObj.correct) {
                    percentages.push(correctPct);
                } else {
                    percentages.push(otherPct[otherIdx++]);
                }
            }

            currentQuestionObj.options.forEach((opt, idx) => {
                const container = document.createElement('div');
                container.className = 'poll-bar-container';
                container.innerHTML = `
                    <div class="poll-bar-label"><strong>${opt}</strong>: ${percentages[idx]}%</div>
                    <div class="poll-bar-bg">
                        <div class="poll-bar-fill" id="pbar-${idx}"></div>
                    </div>
                `;
                pollBody.appendChild(container);
            });

            pollModal.classList.remove('hidden');

            setTimeout(() => {
                percentages.forEach((pct, idx) => {
                    const el = document.getElementById(`pbar-${idx}`);
                    if (el) el.style.width = `${pct}%`;
                });
            }, 100);
        }

        function closePollModal() {
            playSound('click');
            document.getElementById('poll-modal').classList.add('hidden');
        }

        function useSkip() {
            if (usedLifelines['skip']) return;
            playSound('click');
            usedLifelines['skip'] = true;
            document.getElementById('life-skip').disabled = true;

            clearInterval(timerInterval);
            if (currentStage < activeQuestions.length) {
                currentStage++;
                updateStats();
                loadStage();
            } else {
                gameWin();
            }
        }

        function useTimeFreeze() {
            if (usedLifelines['time']) return;
            playSound('click');
            usedLifelines['time'] = true;
            document.getElementById('life-time').disabled = true;

            isTimeFrozen = true;
            document.getElementById('timer-box').innerText = "⌛ FROZEN";
            document.getElementById('timer-bar').style.background = 'var(--accent-gold)';
        }

        function useDoubleCrowns() {
            if (usedLifelines['double']) return;
            playSound('click');
            usedLifelines['double'] = true;
            isDoubleCrownsActive = true;
            document.getElementById('life-double').disabled = true;
            document.getElementById('life-double').innerText = "✨ 2x ACTIVE";
        }

        function renderEndStats() {
            document.getElementById('stat-max-streak').innerText = `${maxStreak}x`;
            const accuracy = totalQuestionsAnswered > 0 
                ? Math.round((correctAnswersCount / totalQuestionsAnswered) * 100) 
                : 0;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
        }

        function gameWin() {
            playSound('cheer');
            triggerConfetti();
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-title').innerText = "👑 GOLDEN PRINCE VICTORY!";
            document.getElementById('result-desc').innerText = `${uiTranslations[currentLang].stageCleared}\nTotal Golden Crowns: ${crowns}`;
            renderEndStats();
        }

        function gameOver(reason) {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-title').innerText = "❌ Game Over";
            document.getElementById('result-desc').innerText = `${reason}\nTotal Golden Crowns: ${crowns}`;
            renderEndStats();
        }

        function restartGame() {
            playSound('click');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
